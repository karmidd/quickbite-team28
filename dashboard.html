<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickBite — Restaurant Dashboard</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#18211d;background:#f5f7f3}*{box-sizing:border-box}body{margin:0}header{background:#183b2a;color:white;padding:20px max(22px,calc((100vw - 1020px)/2));display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}header p{margin:5px 0 0;color:#c2d8ca;font-size:13px}main{max-width:1020px;margin:32px auto;padding:0 22px}section.top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}h2{margin:0 0 6px;font-size:27px}.muted{color:#627266;font-size:14px}select,button{font:inherit;border-radius:10px;padding:10px 14px;border:1px solid #cbd6ce;background:white}button{background:#236c49;color:white;border:none;cursor:pointer;font-weight:650}button:disabled{background:#cad3cc;color:#5d6a60;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px}.order{border:1px solid #dce6dc;border-radius:15px;padding:19px;background:white;box-shadow:0 3px 12px #173b2410}.order-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.order h3{margin:0;font-size:18px}.pill{border-radius:30px;padding:5px 9px;font-size:12px;background:#e7f0e8;color:#234d37;font-weight:700}.detail{display:flex;justify-content:space-between;margin:13px 0;font-size:14px}.order ul{padding-left:20px;line-height:1.9;font-size:14px;border-top:1px solid #edf0ed;border-bottom:1px solid #edf0ed;padding-top:10px;padding-bottom:10px}.actions{display:flex;gap:12px;align-items:center;justify-content:space-between}.notice{padding:13px;border-radius:10px;margin-bottom:20px;background:#e7f4e9}.error{background:#ffe9e7;color:#9f2020}footer{color:#65766b;font-size:12px;margin-top:30px}@media(max-width:500px){header{display:block}}
</style></head><body>
<header><div><h1>QuickBite</h1><p>Restaurant operations • PBI-07 + PBI-08</p></div><span>Prototype / local demo</span></header>
<main><section class="top"><div><h2>Incoming orders</h2><div class="muted">Sorted by requested pickup time (earliest first)</div></div><label>Restaurant <select id="restaurant"><option value="rest-1">Cedar Kitchen</option><option value="rest-2">Maple Pizza</option><option value="rest-3">Green Bowl</option></select></label></section><div id="notice" role="status" aria-live="polite" hidden></div><div id="orders" class="grid"></div><footer>Local demo data is saved in this browser. Replace this temporary storage with the team's shared backend during integration.</footer></main>
<script type="module">
import {nextStatus,updateStatus,ordersForRestaurant,formatMoney,orderTotal} from './orderLogic.mjs';
const KEY='quickbite-p3-orders-v1';
const today=new Date();const pickup=(minutes)=>new Date(today.getTime()+minutes*60000).toISOString();
const seed=[
{id:'QB-1001',restaurantId:'rest-1',pickupTime:pickup(45),status:'Received',items:[{name:'Falafel Wrap',quantity:2,price:12.50},{name:'Lemonade',quantity:1,price:3.50}]},
{id:'QB-1002',restaurantId:'rest-1',pickupTime:pickup(25),status:'Preparing',items:[{name:'Chicken Plate',quantity:1,price:17.00}]},
{id:'QB-1003',restaurantId:'rest-2',pickupTime:pickup(30),status:'Received',items:[{name:'Margherita Pizza',quantity:2,price:14.00}]},
{id:'QB-1004',restaurantId:'rest-3',pickupTime:pickup(60),status:'Ready for Pickup',items:[{name:'Tofu Bowl',quantity:1,price:13.00}]}
];
let orders;try{const saved=JSON.parse(localStorage.getItem(KEY));orders=Array.isArray(saved)?saved:seed;}catch{orders=seed;}
const restaurant=document.querySelector('#restaurant'),holder=document.querySelector('#orders'),notice=document.querySelector('#notice');
function message(text,isError=false){notice.hidden=false;notice.textContent=text;notice.className=isError?'notice error':'notice';}
function row(parent,label,value){const el=document.createElement('div');el.className='detail';const k=document.createElement('span');k.className='muted';k.textContent=label;const v=document.createElement('strong');v.textContent=value;el.append(k,v);parent.append(el);}
function render(){holder.replaceChildren();const visible=ordersForRestaurant(orders,restaurant.value);if(!visible.length){const empty=document.createElement('p');empty.textContent='No incoming orders for this restaurant.';holder.append(empty);return;}
for(const order of visible){const article=document.createElement('article');article.className='order';const head=document.createElement('div');head.className='order-head';const title=document.createElement('h3');title.textContent=order.id;const pill=document.createElement('span');pill.className='pill';pill.textContent=order.status;head.append(title,pill);article.append(head);
row(article,'Pickup',new Date(order.pickupTime).toLocaleString('en-CA',{dateStyle:'medium',timeStyle:'short'}));const ul=document.createElement('ul');for(const item of order.items){const li=document.createElement('li');li.textContent=`${item.quantity} × ${item.name} — ${formatMoney(item.price*item.quantity)}`;ul.append(li)}article.append(ul);row(article,'Total',formatMoney(orderTotal(order)));
const actions=document.createElement('div');actions.className='actions';const next=nextStatus(order.status);const hint=document.createElement('span');hint.className='muted';hint.textContent=next?'Next: '+next:'Order completed';const button=document.createElement('button');button.textContent=next?'Mark '+next:'Completed';button.disabled=!next;button.addEventListener('click',()=>{try{orders=orders.map(o=>o.id===order.id?updateStatus(o,next):o);localStorage.setItem(KEY,JSON.stringify(orders));message(`${order.id} updated to ${next}`);render();}catch(e){message(e.message,true)}});actions.append(hint,button);article.append(actions);holder.append(article);}}
restaurant.addEventListener('change',()=>{notice.hidden=true;render()});render();
</script></body></html>
