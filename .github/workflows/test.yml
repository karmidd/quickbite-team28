# Runs the automated tests on every pull request and every push to main (PBI-11).
# The result shows as a check on the pull request; main only accepts PRs whose check passes.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
