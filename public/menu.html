<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu · QuickBite</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .menu {
      list-style: none;
      padding: 0;
    }

    .menu li {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .menu h2 {
      margin: 0 0 0.25rem;
      font-size: 1.1rem;
    }

    .menu p {
      margin: 0;
    }

    .price {
      font-weight: bold;
      white-space: nowrap;
    }

    .menu-actions {
      display: grid;
      justify-items: end;
      gap: 0.5rem;
    }

    .error {
      color: #c92a2a;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">QuickBite</a>
    <nav>
      <a href="/">Restaurants</a>
      <a href="/checkout.html" id="cart-link">Cart (0)</a>
      <a href="/status.html">Order status</a>
      <a href="/dashboard.html">Restaurant dashboard</a>
    </nav>
  </header>
  <main>
    <p><a href="/">← All restaurants</a></p>
    <h1 id="restaurant-name">Menu</h1>
    <p class="muted" id="restaurant-details"></p>

    <p id="message" role="status" class="muted">Loading menu…</p>
    <div id="cart-message" role="status" class="notice" hidden></div>
    <ul id="menu" class="menu"></ul>
  </main>

  <script type="module">
    import { Cart, CartError } from './cart.js';

    const message = document.getElementById('message');
    const menu = document.getElementById('menu');
    const cartMessage = document.getElementById('cart-message');
    const cartLink = document.getElementById('cart-link');
    const cart = new Cart();
    let currentRestaurant = null;

    function updateCartLink() {
      cartLink.textContent = `Cart (${cart.itemCount})`;
    }

    function formatMoney(cents) {
      return '$' + (cents / 100).toFixed(2);
    }

    function showMessage(text, isError) {
      message.textContent = text;
      message.className = isError ? 'error' : 'muted';
      message.hidden = !text;
    }

    function showRestaurant(restaurant) {
      document.title = restaurant.name + ' · QuickBite';
      document.getElementById('restaurant-name').textContent = restaurant.name;
      document.getElementById('restaurant-details').textContent = restaurant.cuisine + ' · ' + restaurant.address;
    }

    function showCartMessage(text, pendingItem) {
      cartMessage.replaceChildren();
      cartMessage.hidden = !text;
      if (!text) return;

      cartMessage.append(document.createTextNode(text));
      if (pendingItem) {
        const switchButton = document.createElement('button');
        switchButton.type = 'button';
        switchButton.textContent = `Clear cart and switch to ${currentRestaurant.name}`;
        switchButton.addEventListener('click', () => {
          cart.addItem(pendingItem, currentRestaurant, { replace: true });
          updateCartLink();
          showCartMessage(`${pendingItem.name} was added to your new cart.`);
        });
        cartMessage.append(document.createElement('br'), switchButton);
      }
    }

    function addToCart(item) {
      try {
        cart.addItem(item, currentRestaurant);
        updateCartLink();
        showCartMessage(`${item.name} added to cart.`);
      } catch (err) {
        if (err instanceof CartError && err.code === 'DIFFERENT_RESTAURANT') {
          showCartMessage(`${err.message} Clear it before adding items from ${currentRestaurant.name}.`, item);
        } else {
          showCartMessage(err.message || 'Could not add this item to the cart.');
        }
      }
    }

    function showMenu(items) {
      menu.innerHTML = '';
      if (items.length === 0) {
        showMessage('This restaurant has no items on its menu yet.', false);
        return;
      }
      showMessage('', false);

      for (const item of items) {
        const li = document.createElement('li');
        li.className = 'card';
        // The cart (PBI-04) can find each item by this ID
        li.dataset.menuItemId = item.id;

        const text = document.createElement('div');
        const name = document.createElement('h2');
        name.textContent = item.name;
        const description = document.createElement('p');
        description.className = 'muted';
        description.textContent = item.description;
        text.append(name, description);

        const actions = document.createElement('div');
        actions.className = 'menu-actions';
        const price = document.createElement('span');
        price.className = 'price';
        price.textContent = formatMoney(item.priceCents);
        const addButton = document.createElement('button');
        addButton.type = 'button';
        addButton.textContent = 'Add to cart';
        addButton.addEventListener('click', () => addToCart(item));
        actions.append(price, addButton);

        li.append(text, actions);
        menu.append(li);
      }
    }

    async function loadMenu(restaurantId) {
      try {
        const [restaurantsRes, menuRes] = await Promise.all([
          fetch('/api/restaurants'),
          fetch('/api/restaurants/' + encodeURIComponent(restaurantId) + '/menu')
        ]);
        if (menuRes.status === 404) {
          showMessage('Restaurant not found. Please pick one from the restaurant list.', true);
          return;
        }
        if (!restaurantsRes.ok || !menuRes.ok) {
          throw new Error('Server error');
        }
        const restaurants = await restaurantsRes.json();
        const restaurant = restaurants.find((r) => r.id === restaurantId);
        if (restaurant) {
          currentRestaurant = restaurant;
          showRestaurant(restaurant);
        }
        showMenu(await menuRes.json());
      } catch (err) {
        showMessage('Could not load the menu. Please refresh the page to try again.', true);
      }
    }

    // The restaurant list links here as /menu.html?id=r1
    const restaurantId = new URLSearchParams(location.search).get('id');
    updateCartLink();
    if (restaurantId) {
      loadMenu(restaurantId);
    } else {
      showMessage('No restaurant selected. Please pick one from the restaurant list.', true);
    }
  </script>
</body>
</html>
